0 0-.932.022l-9 5A1 1 0 0 0 16 16v7.382l-5.447 2.723c-.339.17-.553.516-.553.895v10a1 1 0 0 0 .485.857L15 40.566V47a1 1 0 0 0 .521.878l11 6a1 1 0 0 0 .994-.021l5-3A1 1 0 0 0 33 50v-7h6v2.184A3 3 0 0 0 37 48c0 1.654 1.346 3 3 3s3-1.346 3-3a3 3 0 0 0-2-2.816V42a1 1 0 0 0-1-1h-7l.001-4h10.585l1.715 1.715A2.95 2.95 0 0 0 45 40c0 1.654 1.346 3 3 3s3-1.346 3-3-1.346-3-3-3a2.95 2.95 0 0 0-1.285.3l-2.008-2.007A1 1 0 0 0 44 35H33.001v-4h15.183A3 3 0 0 0 51 33c1.654 0 3-1.346 3-3s-1.346-3-3-3"/></g></svg><text x="960" y="372" font-size="14" font-weight="bold" text-anchor="middle" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">Amazon Bedrock Guardrails</text><text x="960" y="389" font-size="13" font-weight="normal" text-anchor="middle" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">ApplyGuardrail</text><path d="M300 122 V245" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M300 285 V305" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M300 355 V375" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M300 425 V560 H406" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M454 560 H560 V355" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M560 305 V70 H324" fill="none" stroke="#545B64" stroke-width="2" marker-end="url(#ah)"/><path d="M680 330 H936" fill="none" stroke="#545B64" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><path d="M420 340 H430 V445 H820 V345 H936" fill="none" stroke="#545B64" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><circle cx="278" cy="180" r="12" fill="#232F3E"/><text x="278" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">1</text><circle cx="160" cy="330" r="12" fill="#232F3E"/><text x="160" y="335" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">2</text><circle cx="160" cy="400" r="12" fill="#232F3E"/><text x="160" y="405" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">3</text><circle cx="582" cy="510" r="12" fill="#232F3E"/><text x="582" y="515" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">4</text><circle cx="582" cy="100" r="12" fill="#232F3E"/><text x="582" y="105" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">5</text><circle cx="60" cy="655" r="12" fill="#232F3E"/><text x="60" y="660" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">1</text><text x="82" y="660" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The application sends a Converse request with the provider API key in the API-Key header.</text><circle cx="60" cy="687" r="12" fill="#232F3E"/><text x="60" y="692" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">2</text><text x="82" y="692" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The provider checks the key, then calls ApplyGuardrail with the baseline and redacts PII.</text><circle cx="60" cy="719" r="12" fill="#232F3E"/><text x="60" y="724" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">3</text><text x="82" y="724" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The provider signs the final body with SigV4, using the assumed IAM role, and calls Converse.</text><circle cx="60" cy="751" r="12" fill="#232F3E"/><text x="60" y="756" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">4</text><text x="82" y="756" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">The guardrail checks the model output on the way back.</text><circle cx="60" cy="783" r="12" fill="#232F3E"/><text x="60" y="788" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">5</text><text x="82" y="788" font-size="14" font-weight="normal" text-anchor="start" fill="#232F3E" font-family="'Amazon Ember', Arial, Helvetica, sans-serif">If the guardrail intervenes, the application gets HTTP 422. On input, the model isn't called.</text></svg>