name: WSO2 REST API AI Readiness Guidelines
description: >-
  This ruleset ensures that REST APIs are well-documented and structured to be
  easily understood and utilized by AI systems. It checks for comprehensive
  descriptions, examples, and proper structuring of API components to enhance
  AI readiness.
ruleCategory: SPECTRAL
ruleType: API_DEFINITION
artifactType: REST_API
documentationLink: "https://apim.docs.wso2.com/en/4.5.0/reference/governance/wso2-rest-api-design-guidelines/"
provider: WSO2
rulesetContent:
  extends: [[spectral:oas, off]]
  rules:
    # ============================================================================
    # API-Level Documentation
    # ============================================================================
    
    ai-readiness-api-description:
      description: API must have a comprehensive description for AI understanding
      message: "API description is required and should be at least 50 characters for AI readiness"
      severity: error
      given: $.info
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: description
          category: descriptions
          minLength: 50

    ai-readiness-api-contact:
      description: API should have contact information for AI agent queries
      message: "API contact information is recommended for AI readiness"
      severity: warn
      given: $.info
      then:
        field: contact
        function: truthy

    # ============================================================================
    # Operation-Level Documentation
    # ============================================================================
    
    ai-readiness-operation-summary:
      description: All operations must have a summary for AI understanding
      message: "Operation '{{property}}' must have a summary for AI readiness"
      severity: error
      given: $.paths[*][get,post,put,patch,delete,head,options]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: summary
          category: summaries

    ai-readiness-operation-description:
      description: All operations must have a detailed description
      message: "Operation '{{property}}' must have a description (min 30 characters) for AI readiness"
      severity: error
      given: $.paths[*][get,post,put,patch,delete,head,options]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: description
          category: descriptions
          minLength: 30

    ai-readiness-operation-id:
      description: All operations must have an operationId for AI reference
      message: "Operation must have an operationId for AI readiness"
      severity: error
      given: $.paths[*][get,post,put,patch,delete,head,options]
      then:
        field: operationId
        function: truthy

    ai-readiness-operation-tags:
      description: All operations should have tags for AI categorization
      message: "Operation should have at least one tag for AI categorization"
      severity: warn
      given: $.paths[*][get,post,put,patch,delete,head,options]
      then:
        field: tags
        function: truthy

    # ============================================================================
    # Parameters Documentation
    # ============================================================================
    
    ai-readiness-parameter-description:
      description: All parameters must have descriptions
      message: "Parameter '{{value.name}}' must have a description for AI readiness"
      severity: error
      given: $.paths[*][*].parameters[*]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: description
          category: descriptions

    ai-readiness-parameter-description-length:
      description: Parameter descriptions should be meaningful
      message: "Parameter '{{value.name}}' description should be at least 15 characters"
      severity: warn
      given: $.paths[*][*].parameters[*]
      then:
        field: description
        function: length
        functionOptions:
          min: 15

    ai-readiness-parameter-example:
      description: Query and path parameters should have examples
      message: "Parameter '{{value.name}}' should have an example for AI understanding"
      severity: warn
      given: $.paths[*][*].parameters[?(@.in == 'query' || @.in == 'path')]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: example
          category: examples

    # ============================================================================
    # Request Body Documentation
    # ============================================================================
    
    ai-readiness-request-body-description:
      description: Request bodies must have descriptions
      message: "Request body must have a description for AI readiness"
      severity: error
      given: $.paths[*][post,put,patch].requestBody
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: description
          category: descriptions

    ai-readiness-request-body-example:
      description: Request bodies should have examples
      message: "Request body for {{property}} should have an example for AI understanding"
      severity: warn
      given: $.paths[*][post,put,patch].requestBody.content[*]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          fields: [example, examples]
          category: examples

    # ============================================================================
    # Response Documentation
    # ============================================================================
    
    ai-readiness-response-description:
      description: All responses must have descriptions
      message: "Response '{{property}}' must have a description for AI readiness"
      severity: error
      given: $.paths[*][*].responses[*]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: description
          category: descriptions

    ai-readiness-response-example:
      description: Success responses should have examples
      message: "Response should have an example for AI understanding"
      severity: warn
      given: $.paths[*][*].responses[2??].content[*]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          fields: [example, examples]
          category: examples

    ai-readiness-error-responses-4xx:
      description: Operations must define 4xx error responses
      message: "Operation must define at least one 4xx error response for AI error handling"
      severity: error
      given: $.paths[*][get,post,put,patch,delete]
      then:
        function: aiReadinessErrorResponseCoverage
        functionOptions:
          category: errorResponses
          requiredCodes: ["400", "401", "403", "404", "422", "429"]

    ai-readiness-error-responses-5xx:
      description: Operations should define 5xx error responses
      message: "Operation should define at least one 5xx error response for AI error handling"
      severity: warn
      given: $.paths[*][get,post,put,patch,delete]
      then:
        field: responses
        function: schema
        functionOptions:
          schema:
            type: object
            properties:
              "500": {}
              "502": {}
              "503": {}
              "504": {}
            anyOf:
              - required: ["500"]
              - required: ["502"]
              - required: ["503"]
              - required: ["504"]

    ai-readiness-error-response-schema:
      description: Error responses should have proper schemas
      message: "Error response should have a schema definition for AI error handling"
      severity: warn
      given: $.paths[*][*].responses[4??,5??].content[*]
      then:
        field: schema
        function: truthy

    # ============================================================================
    # Schema Documentation
    # ============================================================================
    
    ai-readiness-schema-description:
      description: All schemas must have descriptions
      message: "Schema '{{property}}' must have a description for AI readiness"
      severity: error
      given: $.components.schemas[*]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: description
          category: descriptions

    ai-readiness-schema-description-length:
      description: Schema descriptions should be meaningful
      message: "Schema '{{property}}' description should be at least 20 characters"
      severity: warn
      given: $.components.schemas[*]
      then:
        field: description
        function: length
        functionOptions:
          min: 20

    ai-readiness-schema-example:
      description: All schemas must have examples
      message: "Schema '{{property}}' must have an example for AI understanding"
      severity: error
      given: $.components.schemas[*]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          fields: [example, examples]
          category: examples

    ai-readiness-schema-property-description:
      description: Schema properties must have descriptions
      message: "Property '{{property}}' in schema must have a description"
      severity: error
      given: $.components.schemas[*].properties[*]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: description
          category: descriptions

    ai-readiness-schema-property-example:
      description: Schema properties should have examples
      message: "Property '{{property}}' should have an example for AI understanding"
      severity: warn
      given: $.components.schemas[*].properties[*]
      then:
        function: aiReadinessFieldCoverage
        functionOptions:
          field: example
          category: examples

    ai-readiness-schema-enum-description:
      description: Enum values should have descriptions
      message: "Enum property '{{property}}' should have a description explaining possible values"
      severity: warn
      given: $.components.schemas[*].properties[?(@.enum)]
      then:
        field: description
        function: truthy

    # ============================================================================
    # Status Codes
    # ============================================================================
    
    ai-readiness-success-response:
      description: Operations must have success responses
      message: "Operation must define at least one success response (2xx) for AI understanding"
      severity: error
      given: $.paths[*][get,post,put,patch,delete]
      then:
        field: responses
        function: schema
        functionOptions:
          schema:
            type: object
            properties:
              "200": {}
              "201": {}
              "202": {}
              "204": {}
            anyOf:
              - required: ["200"]
              - required: ["201"]
              - required: ["202"]
              - required: ["204"]

    # ============================================================================
    # Security Documentation
    # ============================================================================
    
    ai-readiness-security-defined:
      description: API should define security schemes for AI understanding
      message: "API should define security schemes in components for AI readiness"
      severity: warn
      given: $
      then:
        field: components.securitySchemes
        function: truthy

    ai-readiness-security-description:
      description: Security schemes should have descriptions
      message: "Security scheme '{{property}}' should have a description"
      severity: warn
      given: $.components.securitySchemes[*]
      then:
        field: description
        function: truthy

    # ============================================================================
    # Tags Documentation
    # ============================================================================
    
    ai-readiness-tags-description:
      description: All tags must have descriptions
      message: "Tag '{{value.name}}' must have a description for AI categorization"
      severity: warn
      given: $.tags[*]
      then:
        field: description
        function: truthy

    ai-readiness-tags-external-docs:
      description: Tags should have external documentation links
      message: "Tag '{{value.name}}' should have external documentation for AI learning"
      severity: info
      given: $.tags[*]
      then:
        field: externalDocs
        function: truthy

    # ============================================================================
    # Content Negotiation
    # ============================================================================
    
    ai-readiness-response-content-type:
      description: Responses should specify content types
      message: "Response should specify content type (e.g., application/json) for AI understanding"
      severity: warn
      given: $.paths[*][*].responses[2??]
      then:
        field: content
        function: truthy

    # ============================================================================
    # Additional AI-Specific Checks
    # ============================================================================
    
    ai-readiness-discriminator:
      description: Polymorphic schemas should use discriminators
      message: "Schema with oneOf/anyOf should define a discriminator for AI understanding"
      severity: info
      given: $.components.schemas[?(@.oneOf || @.anyOf)]
      then:
        field: discriminator
        function: truthy

    ai-readiness-deprecation-notice:
      description: Deprecated operations should have clear notices
      message: "Deprecated operation should have a detailed description explaining alternatives"
      severity: warn
      given: $.paths[*][?(@.deprecated == true)]
      then:
        field: description
        function: pattern
        functionOptions:
          match: .*(deprecated|alternative|instead|use).*

    ai-readiness-server-description:
      description: Server URLs should have descriptions
      message: "Server should have a description (e.g., production, staging) for AI context"
      severity: info
      given: $.servers[*]
      then:
        field: description
        function: truthy

    # ============================================================================
    # Foundational Compliance
    # ============================================================================

    ai-readiness-openapi-version:
      description: API must declare OpenAPI 3.x specification
      message: "API must use OpenAPI 3.x format (openapi field must start with '3.')"
      severity: error
      given: $
      then:
        field: openapi
        function: pattern
        functionOptions:
          match: "^3\\."

    ai-readiness-servers-defined:
      description: API must define at least one non-empty server URL
      message: "API must define at least one server URL for AI agent connectivity"
      severity: error
      given: $
      then:
        function: aiReadinessServersDefined
        functionOptions:
          category: foundational

    ai-readiness-server-url-not-placeholder:
      description: Server URLs must not be placeholder values
      message: "Server URL appears to be a placeholder — provide a real URL for AI agent connectivity"
      severity: warn
      given: $.servers[*].url
      then:
        function: pattern
        functionOptions:
          notMatch: "(?i)^(https?://)?(localhost(:[0-9]+)?|127\\.0\\.0\\.1|example\\.com|your-api|api\\.example|placeholder|todo|fixme)"

    # ============================================================================
    # Strict Typing & Schema Constraints
    # ============================================================================

    ai-readiness-schema-property-type:
      description: All schema properties must have an explicit type
      message: "Schema property '{{property}}' must have an explicit type defined to prevent ambiguous AI interpretation"
      severity: error
      given: $.components.schemas[*].properties[*]
      then:
        function: aiReadinessSchemaTyping
        functionOptions:
          category: typing

    ai-readiness-parameter-schema-type:
      description: All parameter schemas must have explicit types
      message: "Parameter schema at '{{property}}' must have an explicit type"
      severity: error
      given: $.paths[*][*].parameters[*].schema
      then:
        function: aiReadinessSchemaTyping
        functionOptions:
          category: typing

    ai-readiness-request-body-schema-required:
      description: Request body schemas should define a required array
      message: "Request body schema should declare a 'required' array to clarify mandatory fields for AI agents"
      severity: warn
      given: $.paths[*][post,put,patch].requestBody.content[*].schema
      then:
        field: required
        function: truthy

    ai-readiness-schema-string-format:
      description: String properties with semantic meaning should use format modifiers
      message: "String property '{{property}}' should use a format modifier (e.g., date-time, email, uuid) for unambiguous AI interpretation"
      severity: info
      given: $.components.schemas[*].properties[?(@.type == 'string')]
      then:
        field: format
        function: truthy

    # ============================================================================
    # Rich Error Semantics (RFC 7807)
    # ============================================================================

    ai-readiness-error-schema-fields:
      description: Error response schemas must contain structured fields for AI self-correction
      message: "Error schema must define 'message' and 'code' properties so AI agents can interpret and correct failed requests"
      severity: error
      given: $.paths[*][*].responses[4??,5??].content[*].schema
      then:
        function: aiReadinessErrorSchemaStructure
        functionOptions:
          category: errorSemantics
          requiredFields: [message, code]

    ai-readiness-error-schema-rfc7807:
      description: Error responses should follow RFC 7807 problem detail structure
      message: "Error schema should include 'type', 'title', and 'detail' fields per RFC 7807 for rich AI error semantics"
      severity: warn
      given: $.paths[*][*].responses[4??,5??].content[*].schema
      then:
        function: aiReadinessErrorSchemaStructure
        functionOptions:
          category: errorSemantics
          requiredFields: [type, title, detail]

    # ============================================================================
    # Operational Header Signals
    # ============================================================================

    ai-readiness-429-rate-limit-headers:
      description: Rate-limited responses must include retry guidance headers
      message: "429 response must declare Retry-After or X-RateLimit-* headers so AI agents can back off and retry safely"
      severity: error
      given: "$.paths[*][*].responses['429']"
      then:
        function: aiReadinessRateLimitHeader
        functionOptions:
          category: headers

    # ============================================================================
    # Pagination Standards
    # ============================================================================

    ai-readiness-list-pagination-params:
      description: GET operations should support standard pagination parameters
      message: "GET operation should declare pagination parameters (cursor/page and limit) for AI agent iteration over large result sets"
      severity: warn
      given: $.paths[*].get
      then:
        function: aiReadinessPaginationParams
        functionOptions:
          category: pagination

    # ============================================================================
    # Agent-Friendly Security
    # ============================================================================

    ai-readiness-no-interactive-auth:
      description: Security schemes must not use interactive OAuth flows
      message: "Security scheme '{{property}}' uses an interactive OAuth flow (implicit/authorizationCode) — AI agents cannot complete browser-based authentication"
      severity: error
      given: $.components.securitySchemes[*]
      then:
        function: aiReadinessSecurityScheme
        functionOptions:
          category: security

    # ============================================================================
    # Idempotency for Retries
    # ============================================================================

    ai-readiness-idempotency-key:
      description: Mutating operations should support idempotency for safe AI agent retries
      message: "POST/PATCH operation should declare an Idempotency-Key header parameter to prevent duplicate side-effects on AI agent retries"
      severity: warn
      given: $.paths[*][post,patch]
      then:
        function: aiReadinessIdempotency
        functionOptions:
          category: idempotency