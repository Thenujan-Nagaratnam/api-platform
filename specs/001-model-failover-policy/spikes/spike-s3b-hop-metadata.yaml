# Spike S3b: the hop secret must never reach a provider. An inline Lua filter
# moves x-wso2-failover-hop into dynamic metadata and strips the header; the
# local-reply mapper matches the metadata instead of the (removed) header.
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 19902 } }
static_resources:
  listeners:
  - name: main
    address: { socket_address: { address: 127.0.0.1, port_value: 19010 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: main
          local_reply_config:
            mappers:
            - filter:
                and_filter:
                  filters:
                  - response_flag_filter: { flags: [UF, URX, UH, UO, UT, UC, DC, LR] }
                  - metadata_filter:
                      matcher:
                        filter: wso2.failover
                        path: [{ key: hop }]
                        value: { string_match: { exact: s3cret } }
                      match_if_key_not_found: false
              headers_to_add:
              - header: { key: x-wso2-upstream-failure, value: "%RESPONSE_FLAGS%" }
          http_filters:
          - name: wso2.failover.hop
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(h)
                    local v = h:headers():get("x-wso2-failover-hop")
                    if v ~= nil then
                      h:streamInfo():dynamicMetadata():set("wso2.failover", "hop", v)
                      h:headers():remove("x-wso2-failover-hop")
                    end
                  end
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
          route_config:
            virtual_hosts:
            - name: main
              domains: ["*"]
              routes:
              - match: { prefix: "/dead" }
                route: { cluster: dead }
              - match: { prefix: "/" }
                route: { cluster: backend }
  clusters:
  - name: backend
    type: STATIC
    load_assignment:
      cluster_name: backend
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 19101 } } } }] }]
  - name: dead
    type: STATIC
    connect_timeout: 0.5s
    load_assignment:
      cluster_name: dead
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 19999 } } } }] }]
