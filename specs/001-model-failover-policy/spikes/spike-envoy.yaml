# Spikes S1-S4 (research.md). Local envoy (brew) 1.36.4; gateway ships 1.39.0.
# front :19000 --retry_policy--> internal listener "dispatch" --> backend :19101
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 19901 } }
bootstrap_extensions:
- name: envoy.bootstrap.internal_listener
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener
static_resources:
  listeners:
  - name: front
    address: { socket_address: { address: 127.0.0.1, port_value: 19000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: front
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service: { envoy_grpc: { cluster_name: extproc } }
              processing_mode: { request_header_mode: SEND, response_header_mode: SKIP, request_body_mode: NONE, response_body_mode: NONE }
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_response(h)
                    h:headers():add("x-front-saw-tag", h:headers():get("x-wso2-failover-retry") or "none")
                    h:headers():remove("x-wso2-failover-retry")
                  end
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
          route_config:
            virtual_hosts:
            - name: front
              domains: ["*"]
              routes:
              - match: { prefix: "/bufsmall" }
                per_request_buffer_limit_bytes: 1024
                route: &retryroute
                  cluster: dispatch
                  timeout: 20s
                  retry_policy:
                    retry_on: "retriable-headers,connect-failure,reset"   # final design (research R5)
                    num_retries: 2
                    per_try_timeout: 1s
                    retriable_headers: [{ name: x-wso2-failover-retry, present_match: true }]
                    retry_back_off: { base_interval: 0.001s, max_interval: 0.01s }
              - match: { prefix: "/rt-reset" }
                route:
                  cluster: dispatch
                  timeout: 20s
                  retry_policy:
                    retry_on: "reset"
                    num_retries: 2
                    per_try_timeout: 1s
                    retriable_headers: [{ name: x-wso2-failover-retry, present_match: true }]
              - match: { prefix: "/rt-headers" }
                route:
                  cluster: dispatch
                  timeout: 20s
                  retry_policy:
                    retry_on: "retriable-headers"
                    num_retries: 2
                    per_try_timeout: 1s
                    retriable_headers: [{ name: x-wso2-failover-retry, present_match: true }]
              - match: { prefix: "/rt-connect" }
                route:
                  cluster: dispatch
                  timeout: 20s
                  retry_policy:
                    retry_on: "connect-failure"
                    num_retries: 2
                    per_try_timeout: 1s
                    retriable_headers: [{ name: x-wso2-failover-retry, present_match: true }]
              - match: { prefix: "/rt-refused" }
                route:
                  cluster: dispatch
                  timeout: 20s
                  retry_policy:
                    retry_on: "refused-stream"
                    num_retries: 2
                    per_try_timeout: 1s
                    retriable_headers: [{ name: x-wso2-failover-retry, present_match: true }]
              - match: { prefix: "/rt-hdr-reset" }
                route:
                  cluster: dispatch
                  timeout: 20s
                  retry_policy:
                    retry_on: "retriable-headers,reset"
                    num_retries: 2
                    per_try_timeout: 1s
                    retriable_headers: [{ name: x-wso2-failover-retry, present_match: true }]
              - match: { prefix: "/notimeoutretry" }
                route:
                  cluster: dispatch
                  timeout: 20s
                  retry_policy:
                    retry_on: "retriable-headers,connect-failure,refused-stream,reset"
                    num_retries: 2
                    per_try_timeout: 1s
                    retriable_headers: [{ name: x-wso2-failover-retry, present_match: true }]
                    retry_back_off: { base_interval: 0.001s, max_interval: 0.01s }
              - match: { prefix: "/" }
                route: *retryroute
  - name: dispatch
    internal_listener: {}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: dispatch
          local_reply_config:
            mappers:
            - filter:
                and_filter:
                  filters:
                  - response_flag_filter: { flags: [UF, URX, UH, UO, UT, UC, DC, LR] }
                  - header_filter: { header: { name: x-wso2-failover-hop, string_match: { exact: s3cret } } }
              headers_to_add:
              - header: { key: x-wso2-upstream-failure, value: "%RESPONSE_FLAGS%" }
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service: { envoy_grpc: { cluster_name: extproc } }
              processing_mode: { request_header_mode: SEND, response_header_mode: SKIP, request_body_mode: NONE, response_body_mode: NONE }
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  -- stands in for model-failover[dispatch] classification (eligible: 429, 503)
                  function envoy_on_response(h)
                    local st = h:headers():get(":status")
                    local flags = h:headers():get("x-wso2-upstream-failure")
                    if flags ~= nil then
                      h:headers():add("x-dispatch-saw-flags", flags)
                      h:headers():remove("x-wso2-upstream-failure")
                      h:headers():add("x-wso2-failover-retry", "transport")
                    elseif st == "429" or st == "503" then
                      h:headers():add("x-wso2-failover-retry", "status_" .. st)
                    end
                  end
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
          route_config:
            virtual_hosts:
            - name: dispatch
              domains: ["*"]
              routes:
              - match: { prefix: "/dead" }
                route: { cluster: dead, timeout: 0s }
              - match: { prefix: "/" }
                route: { cluster: backend, timeout: 0s }
  clusters:
  - name: dispatch
    type: STATIC
    circuit_breakers: { thresholds: [{ max_retries: 1024 }] }
    load_assignment:
      cluster_name: dispatch
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { envoy_internal_address: { server_listener_name: dispatch } } } }] }]
    transport_socket:
      name: envoy.transport_sockets.internal_upstream
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.internal_upstream.v3.InternalUpstreamTransport
        transport_socket:
          name: envoy.transport_sockets.raw_buffer
          typed_config: { "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer }
  - name: extproc
    type: STATIC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: extproc
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 19100 } } } }] }]
  - name: backend
    type: STATIC
    load_assignment:
      cluster_name: backend
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 19101 } } } }] }]
  - name: dead
    type: STATIC
    connect_timeout: 0.5s
    load_assignment:
      cluster_name: dead
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 19999 } } } }] }]
