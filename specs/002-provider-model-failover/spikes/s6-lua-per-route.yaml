# Spike S6 (002 research P5): the internal listener strips the hop secret into
# metadata, except on routes that disable the filter per route.
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 19903 } }
static_resources:
  listeners:
  - name: internal-like
    address: { socket_address: { address: 127.0.0.1, port_value: 19020 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: s6
          local_reply_config:
            mappers:
            - filter:
                and_filter:
                  filters:
                  - response_flag_filter: { flags: [UF, URX, UH, UO, UT, UC, DC, LR] }
                  - metadata_filter:
                      matcher: { filter: wso2.failover, path: [{ key: hop }], value: { string_match: { exact: s3cret } } }
                      match_if_key_not_found: false
              headers_to_add:
              - header: { key: x-wso2-upstream-failure, value: "%RESPONSE_FLAGS%" }
          http_filters:
          - name: wso2.failover.hop
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(h)
                    local v = h:headers():get("x-wso2-failover-hop")
                    if v ~= nil then
                      h:streamInfo():dynamicMetadata():set("wso2.failover", "hop", v)
                      h:headers():remove("x-wso2-failover-hop")
                    end
                  end
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
          route_config:
            virtual_hosts:
            - name: v
              domains: ["*"]
              routes:
              - match: { prefix: "/proxy-mode" }
                route: { cluster: backend }
                typed_per_filter_config:
                  wso2.failover.hop:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
                    disabled: true
              - match: { prefix: "/provider-mode-dead" }
                route: { cluster: dead }
              - match: { prefix: "/provider-mode" }
                route: { cluster: backend }
  clusters:
  - name: backend
    type: STATIC
    load_assignment: { cluster_name: backend, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 19121 } } } }] }] }
  - name: dead
    type: STATIC
    connect_timeout: 0.5s
    load_assignment: { cluster_name: dead, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 19998 } } } }] }] }
