[collector]
request_body = false
response_body = false
request_headers = false
response_headers = false

[analytics]
enabled = true
enabled_publishers = ["moesif"]

[analytics.publishers.moesif]
application_id = "<MOESIF_APPLICATION_ID>"

[traffic_logging]
enabled = false
masked_headers = ["authorization", "x-api-key", "x-jwt-assertion"]
max_payload_size = 2048
request_headers = false
response_headers = false
request_body = false
response_body = false
exclude_fields = []

[router]
gateway_host = "*"

[router.access_logs]
enabled = true

[controller.server]
gateway_id = "platform-gateway-id"

[policy_engine.logging]
level = "info"

[controller.logging]
level = "info"

[controller.controlplane]
insecure_skip_verify = true
gateway_name = "default"
apim_oauth2_client_id = "your-client-id"
apim_oauth2_client_secret = "your-client-secret"
# Option 2: Resource Owner Password Credentials Flow (OAuth2)
# apim_oauth2_username = "your-username"
# apim_oauth2_password = "your-password"

[controller.auth.basic]
enabled = true

[[controller.auth.basic.users]]
username = "admin"
password = "admin"
roles = ["admin"]

[policy_configurations.llm_cost_v1]
pricing_file = "/etc/policy-engine/llm-pricing/model_prices.json"

[policy_configurations.oauth2_v1.redis]
# Only resolved if the "redis" docker-compose service is actually running
# (docker compose --profile redis up ...) - otherwise the oauth2 policy's
# token cache falls back to no shared cache (failureMode "open" default).
host = "redis"
port = 6379

[policy_configurations.azure_managed_identity_v1]
# Points the azure-managed-identity policy at the local mock IMDS server
# (gateway/dev-policies/azure-managed-identity/mocks/mock-azure-imds) instead
# of the real 169.254.169.254 - only ever meaningful for local/CI testing,
# since real IMDS is unreachable from anywhere but actual Azure compute.
imds_endpoint = "http://host.docker.internal:9701/metadata/identity/oauth2/token"

[policy_configurations.azure_managed_identity_v1.redis]
host = "redis"
port = 6379

[immutable_gateway]
enabled = false
artifacts_dir = "/etc/api-platform-gateway/immutable_gateway/artifacts"

