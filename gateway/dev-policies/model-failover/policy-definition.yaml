name: model-failover
version: v0.1.0
description: |
  Retries a failed LLM request against a declared fallback chain of
  {model, provider} targets on upstream failure, with correct per-attempt
  credential injection and payload translation.

parameters:
  type: object
  properties:
    targets:
      type: array
      x-wso2-policy-advanced-param: false
      description: |
        Ordered list of client-requested-model failover chains. Each entry's
        own model/provider/upstreamDefinition are authored at the same level
        as fallbacks[] entries use.
      items:
        type: object
        properties:
          model:
            type: string
            description: The client-requested model this chain matches.
            minLength: 1
          provider:
            type: string
            description: |
              Optionally names the provider this target's own request is sent
              to. Must match an LlmProxy additionalProviders[].as value (or
              the provider id when `as` is absent), or the primary provider.
              Omitted, defaults to the proxy's own primary provider.
            minLength: 1
          upstreamDefinition:
            type: string
            description: |
              Optionally overrides which named upstream this target actually
              dials, independent of `provider` (which still determines
              credential/transform identity). Omitted, the dial target
              defaults to `provider`.
            minLength: 1
          fallbacks:
            type: array
            description: Ordered fallback chain tried in sequence after the target fails.
            items:
              type: object
              properties:
                model:
                  type: string
                  description: The model to request from this fallback.
                  minLength: 1
                provider:
                  type: string
                  description: |
                    Names the provider this fallback is sent to. Must match
                    an LlmProxy additionalProviders[].as value (or the
                    provider id when `as` is absent), or the primary
                    provider. Omitted, defaults to the proxy's own primary
                    provider.
                  minLength: 1
                upstreamDefinition:
                  type: string
                  description: |
                    Optionally overrides which named upstream this fallback
                    actually dials, independent of `provider`.
                  minLength: 1
              required:
                - model
        required:
          - model
      minItems: 1
    statusCodes:
      type: array
      x-wso2-policy-advanced-param: true
      description: |
        Response status codes that trigger escalation to the next chain
        member, and count as this target's failure for suspension purposes.
        Omitted, defaults to any 5xx. When set, this REPLACES that default
        entirely rather than extending it — list every code that should
        trigger failover, 5xx codes included if still wanted.
      items:
        type: integer
        minimum: 100
        maximum: 599
      minItems: 1
    suspendDuration:
      type: integer
      x-wso2-policy-advanced-param: true
      description: |
        Seconds a failing target is skipped for. If it fails again as soon as
        it comes back, the window doubles each time, up to 8x this value. When
        a window ends, one request is sent to the target as a probe: success
        restores it, failure suspends it again. Set to 0 to disable suspension
        tracking entirely.
      minimum: 0
      default: 0
    suspendAfterFailures:
      type: integer
      x-wso2-policy-advanced-param: true
      description: |
        Number of CONSECUTIVE qualifying failures (per statusCodes) required
        before a target is suspended. A success resets the count. Omitted or
        1 suspends on the very first qualifying failure.
      minimum: 1
      default: 1
    perTryTimeoutMs:
      type: integer
      x-wso2-policy-advanced-param: true
      description: |
        Bounds each individual chain-member attempt, in milliseconds, so a hung
        target fails over instead of consuming the whole request. perTryTimeoutMs
        x chain length must fit inside the route's overall timeout. Omitted or 0
        leaves the route's overall timeout in effect.
      minimum: 0
    failureRateThresholdPercent:
      type: integer
      x-wso2-policy-advanced-param: true
      description: |
        Also suspends a target once this percentage of its attempts in the last
        60 seconds failed (evaluated from 20 attempts on). Catches a target that
        fails intermittently and so never reaches suspendAfterFailures in a row.
        Omitted or 0 disables the rule.
      minimum: 0
      maximum: 100
    latencyThresholdMs:
      type: integer
      x-wso2-policy-advanced-param: true
      description: |
        Also suspends a target once the p95 of its response times over the last
        60 seconds reaches this many milliseconds (evaluated from 20 attempts
        on), even if it never returns an error. Omitted or 0 disables the rule.
      minimum: 0
  required:
    - targets

  # Note: no requestModel property here. It is never author-configured — like
  # every other LLM-aware policy (e.g. model-round-robin), it's extracted from
  # the LLM provider template and merged into this policy's params
  # automatically by gateway-controller's llm_transformer.go
  # (buildTemplateParams/mergeParams), the same place primaryProvider/
  # operationPath are injected rather than authored. The runtime policy
  # (modelfailover.go) parses and defaults it from its own raw params map.

systemParameters:
  type: object
  properties: {}
