name: AzureContentSafetyContentModeration
version: v1.0.0
description: |
  Validates content using Azure Content Safety API to detect harmful content across
  multiple categories (Hate, Sexual, SelfHarm, Violence). Supports JSONPath extraction
  to validate specific fields within the payload. Can be configured to pass through
  on API errors.
  
  Parameters can be configured separately for request and response phases by nesting them
  under 'request' and 'response' sections. If not nested, parameters apply to both phases.

parameters:
  - name: request
    type: object
    required: false
    description: |
      Configuration for request phase content moderation.
      Contains parameters: azureContentSafetyEndpoint, azureContentSafetyKey, hateCategory,
      sexualCategory, selfHarmCategory, violenceCategory, jsonPath, passthroughOnError, showAssessment
    properties:
      - name: azureContentSafetyEndpoint
        type: string
        required: true
        description: Azure Content Safety API endpoint for request validation
      - name: azureContentSafetyKey
        type: string
        required: true
        description: API key for request validation
      - name: hateCategory
        type: number
        required: false
        default: -1
        description: Hate category threshold for request (0-7, -1 to disable)
      - name: sexualCategory
        type: number
        required: false
        default: -1
        description: Sexual category threshold for request (0-7, -1 to disable)
      - name: selfHarmCategory
        type: number
        required: false
        default: -1
        description: SelfHarm category threshold for request (0-7, -1 to disable)
      - name: violenceCategory
        type: number
        required: false
        default: -1
        description: Violence category threshold for request (0-7, -1 to disable)
      - name: jsonPath
        type: string
        required: false
        description: JSONPath to extract field from request body
      - name: passthroughOnError
        type: boolean
        required: false
        default: false
        description: Allow request to proceed on API errors
      - name: showAssessment
        type: boolean
        required: false
        default: false
        description: Include assessment details in request error responses

  - name: response
    type: object
    required: false
    description: |
      Configuration for response phase content moderation.
      Contains parameters: azureContentSafetyEndpoint, azureContentSafetyKey, hateCategory,
      sexualCategory, selfHarmCategory, violenceCategory, jsonPath, passthroughOnError, showAssessment
    properties:
      - name: azureContentSafetyEndpoint
        type: string
        required: true
        description: Azure Content Safety API endpoint for response validation
      - name: azureContentSafetyKey
        type: string
        required: true
        description: API key for response validation
      - name: hateCategory
        type: number
        required: false
        default: -1
        description: Hate category threshold for response (0-7, -1 to disable)
      - name: sexualCategory
        type: number
        required: false
        default: -1
        description: Sexual category threshold for response (0-7, -1 to disable)
      - name: selfHarmCategory
        type: number
        required: false
        default: -1
        description: SelfHarm category threshold for response (0-7, -1 to disable)
      - name: violenceCategory
        type: number
        required: false
        default: -1
        description: Violence category threshold for response (0-7, -1 to disable)
      - name: jsonPath
        type: string
        required: false
        description: JSONPath to extract field from response body
      - name: passthroughOnError
        type: boolean
        required: false
        default: false
        description: Allow response to proceed on API errors
      - name: showAssessment
        type: boolean
        required: false
        default: false
        description: Include assessment details in response error responses

  # Legacy parameters (for backward compatibility - can be used directly or nested under request/response)
  - name: azureContentSafetyEndpoint
    type: string
    required: true
    description: |
      Azure Content Safety API endpoint URL (without trailing slash).
      Example: https://your-resource.cognitiveservices.azure.com
    validation:
      minLength: 1

  - name: azureContentSafetyKey
    type: string
    required: true
    description: |
      Azure Content Safety API subscription key for authentication.
    validation:
      minLength: 1

  - name: hateCategory
    type: number
    required: false
    default: -1
    description: |
      Severity threshold for Hate category (0-7).
      Content with severity >= threshold will be blocked.
      Set to -1 to disable this category.

  - name: sexualCategory
    type: number
    required: false
    default: -1
    description: |
      Severity threshold for Sexual category (0-7).
      Content with severity >= threshold will be blocked.
      Set to -1 to disable this category.

  - name: selfHarmCategory
    type: number
    required: false
    default: -1
    description: |
      Severity threshold for SelfHarm category (0-7).
      Content with severity >= threshold will be blocked.
      Set to -1 to disable this category.

  - name: violenceCategory
    type: number
    required: false
    default: -1
    description: |
      Severity threshold for Violence category (0-7).
      Content with severity >= threshold will be blocked.
      Set to -1 to disable this category.

  - name: jsonPath
    type: string
    required: false
    description: |
      JSONPath expression to extract a specific field from the payload for validation.
      If not specified, the entire body is validated.

  - name: passthroughOnError
    type: boolean
    required: false
    default: false
    description: |
      If true, allows requests to proceed when Azure API calls fail.
      If false, blocks requests on API errors.

  - name: showAssessment
    type: boolean
    required: false
    default: false
    description: |
      If true, includes detailed assessment information in error responses.

metadata:
  sets:
    - key: azurecontentsafety.validation.passed
      type: boolean
      description: True if content safety validation passed, false otherwise

    - key: azurecontentsafety.categories
      type: object
      description: Category analysis results from Azure Content Safety API
