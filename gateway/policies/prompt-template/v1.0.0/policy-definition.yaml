name: PromptTemplate
version: v1.0.0
description: |
  Dynamically modifies the prompt by applying custom templates using a configured strategy.
  Scans JSON payloads for template references in the format template://<template-name>?<param1>=<value1>&<param2>=<value2>
  and replaces them with predefined templates where parameter placeholders are substituted with provided values.
  
  This is particularly useful for standardizing prompts across different API calls, especially
  when working with large language models or AI services.

parameters:
  - name: name
    type: string
    required: true
    description: The name of the prompt template policy. Used for tracking and referencing this policy instance.

  - name: promptTemplateConfig
    type: string
    required: true
    description: |
      The configuration that defines one or more prompt templates to be used during request mediation.
      Must be a JSON array of template objects, each containing a unique name and a corresponding formatted prompt.
      Example:
      [
        {
          "name": "translate",
          "prompt": "Translate the following text from [[from]] to [[to]]: [[text]]"
        },
        {
          "name": "summarize",
          "prompt": "Summarize the following content in [[length]] words: [[content]]"
        }
      ]
      
      Template placeholders use the format [[parameter-name]] and are replaced with values from the template URI query string.

metadata:
  sets:
    - key: prompttemplate.applied
      type: boolean
      description: True if prompt template replacement was successfully applied
