name: RegexGuardrail
version: v1.0.0
description: |
  Validates that request or response body matches a specified regular expression pattern.
  Supports JSONPath extraction to validate specific fields within the payload.
  Can be inverted to fail when pattern matches.
  
  Parameters can be configured separately for request and response phases by nesting them
  under 'request' and 'response' sections. If not nested, parameters apply to both phases.

parameters:
  - name: request
    type: object
    required: false
    description: |
      Configuration for request phase validation.
      Contains parameters: regex, jsonPath, invert, showAssessment
    properties:
      - name: regex
        type: string
        required: true
        description: Regular expression pattern for request validation
      - name: jsonPath
        type: string
        required: false
        description: JSONPath to extract field from request body
      - name: invert
        type: boolean
        required: false
        default: false
        description: Invert validation logic for request
      - name: showAssessment
        type: boolean
        required: false
        default: false
        description: Include assessment details in request error responses

  - name: response
    type: object
    required: false
    description: |
      Configuration for response phase validation.
      Contains parameters: regex, jsonPath, invert, showAssessment
    properties:
      - name: regex
        type: string
        required: true
        description: Regular expression pattern for response validation
      - name: jsonPath
        type: string
        required: false
        description: JSONPath to extract field from response body
      - name: invert
        type: boolean
        required: false
        default: false
        description: Invert validation logic for response
      - name: showAssessment
        type: boolean
        required: false
        default: false
        description: Include assessment details in response error responses

  # Legacy parameters (for backward compatibility - can be used directly or nested under request/response)
  - name: regex
    type: string
    required: true
    description: |
      Regular expression pattern to match against the content.
      Must be a valid Go regular expression.

  - name: jsonPath
    type: string
    required: false
    description: |
      JSONPath expression to extract a specific field from the payload for validation.
      If not specified, the entire body is validated.

  - name: invert
    type: boolean
    required: false
    default: false
    description: |
      If true, validation is inverted: fails when pattern matches,
      passes when pattern does not match.

  - name: showAssessment
    type: boolean
    required: false
    default: false
    description: |
      If true, includes detailed assessment information in error responses.

metadata:
  sets:
    - key: regex.validation.passed
      type: boolean
      description: True if regex validation passed, false otherwise

    - key: regex.matched
      type: boolean
      description: True if regex pattern matched the content

