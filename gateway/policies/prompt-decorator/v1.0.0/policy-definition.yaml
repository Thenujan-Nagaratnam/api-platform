name: PromptDecorator
version: v1.0.0
description: |
  Dynamically modifies the prompt by applying custom decorations using a configured strategy.
  Supports prepending or appending content to string fields or array fields at a specified JSONPath location.
  Designed for use cases such as enhancing AI prompts or modifying request payloads dynamically.

parameters:
  - name: name
    type: string
    required: true
    description: The name of the prompt decorator policy. Used for tracking and referencing this policy instance.

  - name: promptDecoratorConfig
    type: string
    required: true
    description: |
      The configuration for decorating the prompt in JSON format.
      Must contain a "decoration" field that can be either a string or an array.
      Example for string: {"decoration": "Prefix text"}
      Example for array: {"decoration": [{"role": "system", "content": "You are a helpful assistant"}]}

  - name: jsonPath
    type: string
    required: true
    default: "$.messages"
    description: |
      The JSONPath expression to extract the portion of the prompt that should be modified.
      Supports dot notation (e.g., "$.messages", "$.prompt.content").

  - name: append
    type: boolean
    required: false
    default: false
    description: |
      If true, the decorated content will be appended to the prompt.
      If false (default), the decorated content will be prepended to the prompt.

metadata:
  sets:
    - key: promptdecorator.applied
      type: boolean
      description: True if prompt decoration was successfully applied
