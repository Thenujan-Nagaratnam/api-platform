name: SentenceCountGuardrail
version: v1.0.0
description: |
  Validates that the sentence count of request or response body falls within a specified range.
  Supports JSONPath extraction to validate specific fields within the payload.
  Can be inverted to fail when sentence count is within the range.
  
  Parameters can be configured separately for request and response phases by nesting them
  under 'request' and 'response' sections. If not nested, parameters apply to both phases.

parameters:
  - name: request
    type: object
    required: false
    description: |
      Configuration for request phase validation.
      Contains parameters: min, max, jsonPath, invert, showAssessment
    properties:
      - name: min
        type: number
        required: true
        description: Minimum allowed sentence count for request validation
      - name: max
        type: number
        required: true
        description: Maximum allowed sentence count for request validation
      - name: jsonPath
        type: string
        required: false
        description: JSONPath to extract field from request body
      - name: invert
        type: boolean
        required: false
        default: false
        description: Invert validation logic for request
      - name: showAssessment
        type: boolean
        required: false
        default: false
        description: Include assessment details in request error responses

  - name: response
    type: object
    required: false
    description: |
      Configuration for response phase validation.
      Contains parameters: min, max, jsonPath, invert, showAssessment
    properties:
      - name: min
        type: number
        required: true
        description: Minimum allowed sentence count for response validation
      - name: max
        type: number
        required: true
        description: Maximum allowed sentence count for response validation
      - name: jsonPath
        type: string
        required: false
        description: JSONPath to extract field from response body
      - name: invert
        type: boolean
        required: false
        default: false
        description: Invert validation logic for response
      - name: showAssessment
        type: boolean
        required: false
        default: false
        description: Include assessment details in response error responses

  # Legacy parameters (for backward compatibility - can be used directly or nested under request/response)
  - name: min
    type: number
    required: true
    description: |
      Minimum allowed sentence count.
      Content must contain at least this many sentences to pass validation.
    validation:
      minimum: 0

  - name: max
    type: number
    required: true
    description: |
      Maximum allowed sentence count.
      Content must contain at most this many sentences to pass validation.
    validation:
      minimum: 1

  - name: jsonPath
    type: string
    required: false
    description: |
      JSONPath expression to extract a specific field from the payload for validation.
      If not specified, the entire body is validated.

  - name: invert
    type: boolean
    required: false
    default: false
    description: |
      If true, validation is inverted: fails when sentence count is within the range,
      passes when sentence count is outside the range.

  - name: showAssessment
    type: boolean
    required: false
    default: false
    description: |
      If true, includes detailed assessment information in error responses.

metadata:
  sets:
    - key: sentencecount.validation.passed
      type: boolean
      description: True if sentence count validation passed, false otherwise

    - key: sentencecount.count
      type: number
      description: Actual sentence count that was validated

